# ==========================================================
# Named Volumes（Docker 托管，Windows 性能优于 bind mount）
# ----------------------------------------------------------
# 数据持久化到 Docker 数据目录；清理：docker volume rm lg-<name>
# 全删：docker compose down -v
# ==========================================================
volumes:
  lg-pgdata:
  lg-mysql-data:
  lg-redis-data:
  # 可选服务的 volume，启用对应 service 时取消注释
  # lg-minio-data:
  # lg-es-data:
