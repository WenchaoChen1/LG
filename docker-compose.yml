  #   image: elasticsearch:8.17.4
  #   container_name: lg-elasticsearch
  #   restart: unless-stopped
  #   logging: *default-logging
  #   networks: [lg-net]
  #   environment:
  #     discovery.type: single-node
  #     ES_JAVA_OPTS: -Xms512m -Xmx1g
  #     xpack.security.enabled: "false"
